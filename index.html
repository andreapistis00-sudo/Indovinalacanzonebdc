<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>INDOVINA LA CANZONE AL BDC</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<a class="skip-link" href="#main">Salta al contenuto</a>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M9 18a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm10-16v14.1a5 5 0 0 0-3-.9c-2.8 0-5 1.8-5 4s2.2 4 5 4 5-1.8 5-4V6.7l-10 2V20h2V6.1L21 4V2h-2Z"/>
      </svg>
    </span>
    <div class="brandText">
      <h1>INDOVINA LA CANZONE AL BDC</h1>
      <p class="sub">Quiz musicale offline</p>
    </div>
  </div>

  <div class="topActions">
    <button id="toLeaderboard" class="btn">Classifica</button>
  </div>
</header>

<main id="main" class="container">

<!-- START -->
<section id="screenStart" class="card screen">
  <div class="cardHeader">
    <h2>Start</h2>
  </div>

  <div class="grid2">
    <div class="panel">

      <label class="field">
        <span class="label">Modalità</span>
        <select id="modeSelect">
          <option value="solo">Singolo</option>
          <option value="teams">Squadre</option>
        </select>
      </label>

      <div id="soloBox">
        <label class="field">
          <span class="label">Nome giocatore</span>
          <input id="playerNameInput" class="input">
        </label>
      </div>

      <div id="teamsBox" hidden>
        <label class="field">
          <span class="label">Nome squadra</span>
          <div class="inlineAdd">
            <input id="teamNameInput" class="input">
            <button id="addTeamBtn" class="btn">Aggiungi</button>
          </div>
        </label>
        <ul id="teamsList" class="miniList"></ul>
      </div>

      <label class="field">
        <span class="label">Round</span>
        <select id="roundsSelect">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
        </select>
      </label>

      <label class="field row">
        <span class="label">Timer</span>
        <input id="timerToggle" type="checkbox" checked>
      </label>

      <label class="field">
        <span class="label">Secondi per round</span>
        <input id="timerSeconds" type="number" value="45">
      </label>
    </div>

    <div class="panel">
      <button id="startBtn" class="btn primary big">▶ Inizia</button>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="screenGame" class="card screen" hidden>
  <div class="cardHeader rowBetween">
    <h2 id="roundMeta">Round</h2>
    <div class="hud">
      <div class="hudItem">
        <span class="hudLabel">Turno</span>
        <span id="hudPlayer">—</span>
      </div>
      <div class="hudItem">
        <span class="hudLabel">Punti</span>
        <span id="hudScore">0</span>
      </div>
      <div class="hudItem">
        <span class="hudLabel">Tempo</span>
        <span id="hudTime">—</span>
      </div>
    </div>
  </div>

  <div class="gameGrid">
    <div class="panel">
      <h3 class="panelTitle">Indizi</h3>
      <ol id="cluesList" class="clues"></ol>

      <label class="field">
        <span class="label">Risposta</span>
        <input id="answerInput" class="input">
      </label>

      <div class="actions">
        <button id="confirmBtn" class="btn primary">Conferma</button>
        <button id="hintBtn" class="btn">Indizio</button>
        <button id="skipBtn" class="btn ghost">Salta</button>
        <button id="goLeaderboardBtn" class="btn">Classifica</button>

        <!-- 🔐 RESET PROTETTO -->
        <button id="resetGameBtn" class="btn danger ghost">
          Reset partita
        </button>
      </div>

      <div id="feedback" class="feedback"></div>
    </div>
  </div>
</section>

<!-- LEADERBOARD -->
<section id="screenLeaderboard" class="card screen" hidden>
  <div class="cardHeader rowBetween">
    <h2>Classifica</h2>
    <button id="backToStart" class="btn ghost">← Start</button>
  </div>

  <div class="panel">
    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>Punti</th>
        </tr>
      </thead>
      <tbody id="lbBody"></tbody>
    </table>
  </div>
</section>

<script src="script.js"></script>
</main>
</body>
</html>
