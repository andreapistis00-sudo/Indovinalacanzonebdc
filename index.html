<!-- GAME -->
<section id="screenGame" class="card screen" hidden>
  <div class="cardHeader rowBetween">
    <h2 id="roundMeta">Round</h2>
    <div class="hud">
      <div class="hudItem">
        <span class="hudLabel">Turno</span>
        <span id="hudPlayer">—</span>
      </div>
      <div class="hudItem">
        <span class="hudLabel">Punti</span>
        <span id="hudScore">0</span>
      </div>
      <div class="hudItem">
        <span class="hudLabel">Tempo</span>
        <span id="hudTime">—</span>
      </div>
    </div>
  </div>

  <div class="gameGrid">
    <div class="panel">
      <h3 class="panelTitle">Indizi</h3>
      <ol id="cluesList" class="clues"></ol>

      <label class="field">
        <span class="label">Risposta</span>
        <input id="answerInput" class="input">
      </label>

      <div class="actions">
        <button id="confirmBtn" class="btn primary">Conferma</button>
        <button id="hintBtn" class="btn">Indizio</button>
        <button id="skipBtn" class="btn ghost">Salta</button>
        <button id="goLeaderboardBtn" class="btn">Classifica</button>
      </div>

      <div id="feedback" class="feedback"></div>

      <!-- 🔐 ZONA HOST (SEMPRE VISIBILE) -->
      <div class="divider"></div>

      <div class="actions">
        <button id="resetGameBtn" class="btn danger">
          🔐 Reset partita
        </button>
      </div>
    </div>
  </div>
</section>
